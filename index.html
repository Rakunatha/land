<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Response Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        width: min(800px, 92%);
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
        margin-top: 0;
    }

    .subtitle {
        color: #666;
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
    }

    input, select, textarea {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
    }

    .field {
        border: 1px solid #ddd;
        padding: 16px;
        margin-top: 15px;
        border-radius: 9px;
        background: #fafafa;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 18px;
        border: none;
        border-radius: 7px;
        background: #222;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        opacity: .85;
    }

    .remove {
        background: #c62828;
    }

    .generate {
        background: #1769aa;
    }

    #output {
        margin-top: 25px;
        padding: 15px;
        border-radius: 8px;
        background: #f1f1f1;
        white-space: pre-wrap;
        font-family: monospace;
        overflow-x: auto;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Form Response Generator</h1>

    <div class="subtitle">
        Generate test response payloads from a simple browser interface.
    </div>

    <label>Google Form ID</label>

    <input
        id="formId"
        placeholder="Enter Form ID"
    >

    <label>Number of responses</label>

    <input
        id="responseCount"
        type="number"
        min="1"
        max="1000"
        value="10"
    >

    <h3>Fields</h3>

    <div id="fields"></div>

    <button onclick="addField()">
        + Add Field
    </button>

    <button class="generate" onclick="generateResponses()">
        Generate Test Responses
    </button>

    <div id="output">
        No responses generated yet.
    </div>

</div>

<script>

function randomString(length = 8) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";

    for (let i = 0; i < length; i++) {
        result += characters.charAt(
            Math.floor(Math.random() * characters.length)
        );
    }

    return result;
}


function randomEmail() {

    return "test" +
        randomString(8).toLowerCase() +
        "@example.com";
}


function randomChoice(value) {

    const options = value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

    if (!options.length) {
        return "";
    }

    return options[
        Math.floor(Math.random() * options.length)
    ];
}


function generateValue(type, value) {

    switch (type) {

        case "random_text":
            return "Test " + randomString();

        case "random_email":
            return randomEmail();

        case "random_choice":
            return randomChoice(value);

        default:
            return value;
    }
}


function addField() {

    const container =
        document.getElementById("fields");

    const field =
        document.createElement("div");

    field.className = "field";

    field.innerHTML = `

        <label>Entry ID</label>

        <input
            class="entryId"
            placeholder="entry.123456789"
        >

        <label>Response Type</label>

        <select class="fieldType">

            <option value="text">
                Fixed Text
            </option>

            <option value="random_text">
                Random Text
            </option>

            <option value="random_email">
                Random Email
            </option>

            <option value="random_choice">
                Random Choice
            </option>

        </select>

        <label>Value / Options</label>

        <input
            class="fieldValue"
            placeholder="Example: Option A, Option B, Option C"
        >

        <button
            class="remove"
            onclick="this.parentElement.remove()"
        >
            Remove Field
        </button>
    `;

    container.appendChild(field);
}


function collectFields() {

    const fields = [];

    document
        .querySelectorAll(".field")
        .forEach(field => {

            const entryId =
                field.querySelector(".entryId").value.trim();

            const type =
                field.querySelector(".fieldType").value;

            const value =
                field.querySelector(".fieldValue").value;

            if (entryId) {

                fields.push({
                    entryId,
                    type,
                    value
                });

            }

        });

    return fields;
}


function generateResponses() {

    const formId =
        document.getElementById("formId").value.trim();

    const count =
        Number(
            document.getElementById("responseCount").value
        );

    if (!formId) {

        alert("Please enter a Form ID.");

        return;
    }

    if (!count || count < 1) {

        alert("Enter a valid response count.");

        return;
    }

    const fields = collectFields();

    const responses = [];

    for (let i = 0; i < count; i++) {

        const response = {};

        fields.forEach(field => {

            response[field.entryId] =
                generateValue(
                    field.type,
                    field.value
                );

        });

        responses.push(response);
    }

    const output =
        document.getElementById("output");

    output.textContent =
        JSON.stringify(
            {
                formId: formId,
                totalResponses: count,
                responses: responses
            },
            null,
            2
        );
}


// Add one field automatically

addField();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MFA — Deal Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1F2A;
    --ink-soft: #2C3140;
    --paper: #EFECE3;
    --paper-raised: #FBFAF6;
    --rule: #D7D0C0;
    --rule-soft: #E4DFD2;
    --steel: #5B6472;
    --steel-soft: #8A93A0;
    --seal: #1C4E80;
    --seal-soft: #E7EEF5;
    --clear: #2F7B4F;
    --clear-soft: #E4F1E8;
    --pending: #B8792B;
    --pending-soft: #F7ECDC;
    --blocked: #B0402E;
    --blocked-soft: #F8E6E2;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ECE9E1; --ink-soft: #C9C4B8;
      --paper: #14161C; --paper-raised: #1C1F27;
      --rule: #333846; --rule-soft: #262A34;
      --steel: #9AA2B1; --steel-soft: #6E7686;
      --seal: #6FA8DC; --seal-soft: #1E2C3B;
      --clear: #6FCF97; --clear-soft: #16281F;
      --pending: #E3A857; --pending-soft: #2E2415;
      --blocked: #E38073; --blocked-soft: #301A18;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ECE9E1; --ink-soft: #C9C4B8;
    --paper: #14161C; --paper-raised: #1C1F27;
    --rule: #333846; --rule-soft: #262A34;
    --steel: #9AA2B1; --steel-soft: #6E7686;
    --seal: #6FA8DC; --seal-soft: #1E2C3B;
    --clear: #6FCF97; --clear-soft: #16281F;
    --pending: #E3A857; --pending-soft: #2E2415;
    --blocked: #E38073; --blocked-soft: #301A18;
  }

  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.2);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--seal);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 600; font-size: 13px;
    color: white;
    flex: none;
  }
  .brand-name {
    font-weight: 600; font-size: 16px; letter-spacing: 0.2px;
  }
  .brand-sub {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--steel-soft);
    margin-top: -1px;
  }
  .topbar-stats {
    display: flex; gap: 22px;
  }
  .stat { text-align: right; }
  .stat-num { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
  .stat-label { font-size: 10px; color: var(--steel-soft); margin-top: 1px; }

  @media (max-width: 720px) {
    .topbar-stats { display: none; }
  }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 268px 1fr;
    min-height: calc(100vh - 62px);
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  .sidebar {
    border-right: 1px solid var(--rule);
    padding: 16px 14px 30px;
    background: var(--paper);
  }
  @media (max-width: 860px) {
    .sidebar {
      border-right: none;
      border-bottom: 1px solid var(--rule);
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 12px 14px;
    }
    .sidebar-heading, .sidebar-foot { display: none; }
    .deal-list { display: flex; gap: 10px; }
    .deal-card { min-width: 190px; flex: none; }
  }

  .sidebar-heading {
    font-size: 11px; color: var(--steel); letter-spacing: 0.4px;
    margin: 4px 4px 10px;
  }

  .deal-list { display: flex; flex-direction: column; gap: 8px; }

  .deal-card {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 11px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .deal-card:hover { border-color: var(--steel-soft); }
  .deal-card.active { border-color: var(--seal); box-shadow: 0 0 0 1px var(--seal) inset; }
  .deal-card-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .deal-id { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .deal-reg { font-size: 12px; color: var(--steel); margin-top: 2px; }
  .deal-gauge-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .deal-gauge-track {
    flex: 1; height: 5px; border-radius: 3px; background: var(--rule-soft); overflow: hidden;
  }
  .deal-gauge-fill { height: 100%; border-radius: 3px; background: var(--seal); }
  .deal-gauge-fill.done { background: var(--clear); }
  .deal-pct { font-family: var(--font-mono); font-size: 10.5px; color: var(--steel); }

  .new-deal-btn {
    width: 100%; margin-top: 12px;
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 10px;
    padding: 11px; font-family: var(--font-display); font-weight: 600; font-size: 13px;
    cursor: pointer;
  }
  @media (max-width: 860px) { .new-deal-btn { width: auto; white-space: nowrap; margin-top: 0; } }
  .new-deal-btn:active { transform: translateY(1px); }

  .sidebar-foot {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--rule-soft);
    font-size: 11px; color: var(--steel-soft); line-height: 1.5;
  }

  /* ---------- Main ---------- */
  .main {
    padding: 22px clamp(16px, 4vw, 40px) 60px;
    max-width: 900px;
  }

  .deal-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .deal-head h1 {
    font-size: clamp(21px, 3vw, 26px);
    margin: 0 0 4px;
    letter-spacing: -0.2px;
  }
  .deal-meta {
    font-family: var(--font-mono); font-size: 12px; color: var(--steel);
    display: flex; flex-wrap: wrap; gap: 4px 14px;
  }
  .status-pill {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 100px;
    white-space: nowrap; height: fit-content;
  }
  .pill-clear { background: var(--clear-soft); color: var(--clear); }
  .pill-pending { background: var(--pending-soft); color: var(--pending); }
  .pill-blocked { background: var(--blocked-soft); color: var(--blocked); }
  .pill-locked { background: var(--rule-soft); color: var(--steel); }

  .fuel-wrap { display: flex; align-items: center; gap: 10px; margin: 18px 0 26px; }
  .fuel-gauge { width: 92px; height: 52px; flex: none; }
  .fuel-caption { font-size: 12.5px; color: var(--steel); line-height: 1.5; }
  .fuel-caption b { color: var(--ink); font-weight: 600; }

  .section {
    margin-bottom: 26px;
  }
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14.5px; font-weight: 600;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  .section-hint { font-size: 11.5px; color: var(--steel-soft); font-weight: 400; font-family: var(--font-mono); }

  .row-card {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .row-icon {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .icon-clear { background: var(--clear-soft); color: var(--clear); }
  .icon-pending { background: var(--pending-soft); color: var(--pending); }
  .icon-blocked { background: var(--blocked-soft); color: var(--blocked); }
  .icon-locked { background: var(--rule-soft); color: var(--steel-soft); }

  .row-body { flex: 1; min-width: 0; }
  .row-title { font-size: 13.5px; font-weight: 500; }
  .row-sub { font-size: 12px; color: var(--steel); margin-top: 1px; }
  .row-sub.blocked-text { color: var(--blocked); }
  .row-sub.pending-text { color: var(--pending); }

  .row-action {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    border: 1px solid var(--rule); background: transparent; color: var(--ink);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .row-action:hover { border-color: var(--steel-soft); }
  .row-action:disabled { opacity: 0.4; cursor: not-allowed; }
  .row-action.primary { background: var(--seal); color: white; border-color: var(--seal); }
  .row-action.ghost { color: var(--steel); }

  .scan-note {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--steel);
    display: flex; align-items: center; gap: 8px; padding: 4px 2px 10px;
  }
  .dot-flicker {
    width: 6px; height: 6px; border-radius: 50%; background: var(--seal);
    animation: flicker 0.9s infinite ease-in-out;
  }
  @keyframes flicker { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  .close-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex-wrap: wrap;
    background: var(--paper-raised);
    border: 1px dashed var(--rule);
    border-radius: 12px;
    padding: 16px;
    margin-top: 6px;
  }
  .close-bar-text { font-size: 12.5px; color: var(--steel); max-width: 420px; line-height: 1.5; }
  .close-btn {
    font-family: var(--font-display); font-weight: 600; font-size: 13.5px;
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 9px; padding: 12px 20px; cursor: pointer;
    white-space: nowrap;
  }
  .close-btn:disabled { background: var(--rule); color: var(--steel-soft); cursor: not-allowed; }

  .seal-block {
    text-align: center; padding: 34px 20px;
    background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 14px;
  }
  .seal-ring {
    width: 74px; height: 74px; border-radius: 50%;
    border: 2.5px solid var(--clear);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
    font-size: 30px; color: var(--clear);
    animation: pop 0.4s ease;
  }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .seal-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .seal-sub { font-size: 12.5px; color: var(--steel); font-family: var(--font-mono); }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,12,16,0.55);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50; padding: 0;
  }
  @media (min-width: 640px) { .overlay { align-items: center; padding: 20px; } }
  .modal {
    background: var(--paper-raised);
    width: 100%; max-width: 480px;
    border-radius: 16px 16px 0 0;
    max-height: 90vh; overflow-y: auto;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 640px) { .modal { border-radius: 16px; } }
  .modal h2 { font-size: 18px; margin: 0 0 3px; }
  .modal .sub { font-size: 12.5px; color: var(--steel); margin-bottom: 18px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 11.5px; color: var(--steel); margin-bottom: 5px; font-family: var(--font-mono); }
  .field input, .field select {
    width: 100%; padding: 10px 11px; border-radius: 8px;
    border: 1px solid var(--rule); background: var(--paper);
    color: var(--ink); font-family: var(--font-display); font-size: 13.5px;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--seal); outline-offset: 1px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-secondary {
    flex: 1; padding: 12px; border-radius: 9px; border: 1px solid var(--rule);
    background: transparent; color: var(--ink); font-family: var(--font-display);
    font-weight: 500; font-size: 13.5px; cursor: pointer;
  }
  .btn-primary {
    flex: 1.4; padding: 12px; border-radius: 9px; border: none;
    background: var(--seal); color: white; font-family: var(--font-display);
    font-weight: 600; font-size: 13.5px; cursor: pointer;
  }

  /* ---------- Doc preview ---------- */
  .doc-preview {
    border: 1px solid var(--rule); border-radius: 10px; padding: 18px;
    background: var(--paper-raised); font-size: 12.5px; line-height: 1.7; color: var(--ink-soft);
    margin-top: 10px;
  }
  .doc-preview h3 {
    font-size: 14px; margin: 0 0 10px; color: var(--ink); text-align: center;
    border-bottom: 1px solid var(--rule); padding-bottom: 10px;
  }
  .doc-preview .kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-family: var(--font-mono); font-size: 11.5px; }
  .doc-preview .stamp {
    margin-top: 14px; text-align: right; font-family: var(--font-mono); font-size: 10.5px; color: var(--clear);
  }

  a.link-btn { color: var(--seal); font-family: var(--font-mono); font-size: 11.5px; text-decoration: underline; cursor: pointer; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">M</div>
    <div>
      <div class="brand-name">MFA</div>
      <div class="brand-sub">DEAL LEDGER — HORIZON MOTORS</div>
    </div>
  </div>
  <div class="topbar-stats">
    <div class="stat"><div class="stat-num" id="statOpen">–</div><div class="stat-label">open deals</div></div>
    <div class="stat"><div class="stat-num" id="statClosed">–</div><div class="stat-label">closed</div></div>
    <div class="stat"><div class="stat-num" id="statDocs">–</div><div class="stat-label">docs issued</div></div>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-heading">DEALS</div>
    <div class="deal-list" id="dealList"></div>
    <button class="new-deal-btn" id="newDealBtn">+ New deal</button>
    <div class="sidebar-foot">Simulated demo — compliance checks and party responses are generated locally, not live government or bank data.</div>
  </div>

  <div class="main" id="main"></div>
</div>

<div id="modalRoot"></div>

<script>
(function () {
  "use strict";

  // ---------------- Deterministic pseudo-random from a string ----------------
  function seedFrom(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return function () {
      h ^= h << 13; h ^= h >>> 17; h ^= h << 5;
      return ((h >>> 0) % 1000) / 1000;
    };
  }

  const CHECK_DEFS = [
    { id: "rc", label: "RC verified against VAHAN registry" },
    { id: "lien", label: "Hypothecation / lien status" },
    { id: "insurance", label: "Insurance policy validity" },
    { id: "puc", label: "PUC (pollution) certificate" },
    { id: "kyc", label: "Buyer KYC — PAN & Aadhaar match" }
  ];

  const PARTY_DEFS = [
    { id: "buyer", role: "Buyer", label: b => b.buyerName },
    { id: "bank", role: "Financier", label: b => b.bank || "— no financier —" },
    { id: "insurer", role: "Insurer", label: b => b.insurer },
    { id: "rto", role: "RTO", label: b => "Regional Transport Office" }
  ];

  const DOC_DEFS = [
    { id: "sale_agreement", name: "Sale agreement & invoice", requires: ["kyc"] },
    { id: "form_2930", name: "Form 29 & 30 — ownership transfer", requires: ["rc", "lien"] },
    { id: "insurance_transfer", name: "Insurance transfer letter", requires: ["insurance"], party: "insurer" },
    { id: "loan_noc", name: "Loan closure NOC", requires: ["lien"], party: "bank", onlyIfFinanced: true },
    { id: "indemnity", name: "Indemnity-cum-undertaking", requires: ["puc"] }
  ];

  function buildDeal(input, idNum) {
    const rand = seedFrom(input.vin + input.regNo);
    const financed = !!input.bank;

    const checks = CHECK_DEFS.map(def => {
      let status = "clear";
      let detail = "Matches registry record.";
      if (def.id === "lien") {
        if (financed) { status = "pending"; detail = "Awaiting hypothecation confirmation from financier."; }
        else if (rand() < 0.15) { status = "blocked"; detail = "Existing lien not yet released."; }
        else { detail = "No lien recorded."; }
      } else if (def.id === "puc") {
        if (rand() < 0.2) { status = "blocked"; detail = "Certificate expired — renewal required before transfer."; }
        else detail = "Valid, checked against issuing centre.";
      } else if (def.id === "insurance") {
        if (rand() < 0.1) { status = "pending"; detail = "Policy document uploaded, insurer confirmation pending."; }
        else detail = "Active comprehensive policy on file.";
      } else if (def.id === "rc") {
        detail = "Registration certificate matches chassis & engine number.";
      } else if (def.id === "kyc") {
        if (rand() < 0.25) { status = "pending"; detail = "Aadhaar e-sign requested from buyer."; }
        else detail = "PAN and address proof verified.";
      }
      return { ...def, status, detail };
    });

    const parties = PARTY_DEFS
      .filter(p => p.id !== "bank" || financed)
      .map(p => ({
        id: p.id, role: p.role, name: p.label(input),
        status: p.id === "buyer" ? "clear" : (p.id === "rto" ? "pending" : "pending")
      }));

    const docs = DOC_DEFS
      .filter(d => !d.onlyIfFinanced || financed)
      .map(d => ({ ...d, status: "locked", generatedAt: null }));

    return {
      id: "MFA-" + idNum,
      regNo: input.regNo,
      vin: input.vin,
      buyerName: input.buyerName,
      buyerPan: input.buyerPan,
      bank: input.bank || null,
      insurer: input.insurer,
      saleAmount: input.saleAmount,
      dealership: "Horizon Motors",
      createdAt: new Date(),
      status: "in_progress",
      scanning: true,
      revealedChecks: 0,
      checks,
      parties,
      docs
    };
  }

  // ---------------- Seed data ----------------
  let dealSeq = 3;
  const state = {
    deals: [
      finishScan(buildDeal({
        regNo: "KA 04 MH 2291", vin: "MA3ERLF1S00184213",
        buyerName: "Arjun Nair", buyerPan: "BXPPN1234K",
        bank: "HDFC Bank", insurer: "ICICI Lombard", saleAmount: "₹9,40,000"
      }, 2291)),
      finishScan(buildDeal({
        regNo: "KA 05 AB 7710", vin: "MA3FYEF1S00177029",
        buyerName: "Priya Menon", buyerPan: "CZTPM5678L",
        bank: "", insurer: "Bajaj Allianz", saleAmount: "₹5,80,000"
      }, 2288)),
      finishScan(buildDeal({
        regNo: "KA 03 CD 4021", vin: "MA3NYEF1S00199981",
        buyerName: "Ravi Subramaniam", buyerPan: "DPQRS9012M",
        bank: "Axis Bank", insurer: "HDFC Ergo", saleAmount: "₹12,10,000"
      }, 2276))
    ],
    activeId: null,
    docsIssuedTotal: 0
  };

  // pre-close deal #2276 fully for a realistic "closed" example
  (function seedClosed() {
    const d = state.deals[2];
    d.checks.forEach(c => c.status = "clear");
    d.parties.forEach(p => p.status = "clear");
    d.docs.forEach(doc => { doc.status = "generated"; doc.generatedAt = new Date(Date.now() - 86400000); });
    d.status = "closed";
    state.docsIssuedTotal += d.docs.length;
  })();
  // partially progress deal #2288
  (function seedPartial() {
    const d = state.deals[1];
    d.checks.forEach(c => { if (c.id !== "puc") c.status = "clear"; });
    d.parties.find(p => p.id === "buyer").status = "clear";
    d.docs.find(x => x.id === "sale_agreement").status = "generated";
    d.docs.find(x => x.id === "sale_agreement").generatedAt = new Date();
    state.docsIssuedTotal += 1;
  })();

  state.activeId = state.deals[0].id;

  function finishScan(deal) {
    deal.scanning = false;
    deal.revealedChecks = deal.checks.length;
    return deal;
  }

  function getDeal(id) { return state.deals.find(d => d.id === id); }

  function dealProgress(deal) {
    const checkTotal = deal.checks.length;
    const checkClear = deal.checks.filter(c => c.status === "clear").length;
    const partyTotal = deal.parties.length;
    const partyClear = deal.parties.filter(p => p.status === "clear").length;
    const docTotal = deal.docs.length;
    const docDone = deal.docs.filter(d => d.status === "generated").length;
    const total = checkTotal + partyTotal + docTotal;
    const done = checkClear + partyClear + docDone;
    return total ? Math.round((done / total) * 100) : 0;
  }

  function canGenerateDoc(deal, doc) {
    if (doc.status === "generated") return true;
    return doc.requires.every(reqId => {
      const c = deal.checks.find(c => c.id === reqId);
      return c && c.status === "clear";
    }) && (!doc.party || deal.parties.find(p => p.id === doc.party)?.status === "clear");
  }

  function allClearForClose(deal) {
    return deal.checks.every(c => c.status === "clear")
      && deal.parties.every(p => p.status === "clear")
      && deal.docs.every(d => d.status === "generated");
  }

  // ---------------- Rendering ----------------
  function iconFor(status) {
    if (status === "clear") return { cls: "clear", glyph: "✓" };
    if (status === "pending") return { cls: "pending", glyph: "···" };
    if (status === "blocked") return { cls: "blocked", glyph: "!" };
    return { cls: "locked", glyph: "•" };
  }

  function pillFor(status) {
    if (status === "clear") return '<span class="status-pill pill-clear">CLEAR</span>';
    if (status === "pending") return '<span class="status-pill pill-pending">PENDING</span>';
    if (status === "blocked") return '<span class="status-pill pill-blocked">BLOCKED</span>';
    if (status === "generated") return '<span class="status-pill pill-clear">ISSUED</span>';
    return '<span class="status-pill pill-locked">LOCKED</span>';
  }

  function fuelGaugeSvg(pct) {
    const angle = -90 + (pct / 100) * 180;
    const rad = (angle * Math.PI) / 180;
    const cx = 46, cy = 46, r = 34;
    const x = cx + r * Math.cos(rad);
    const y = cy + r * Math.sin(rad);
    const color = pct >= 100 ? "var(--clear)" : pct >= 50 ? "var(--seal)" : "var(--pending)";
    return `<svg class="fuel-gauge" viewBox="0 0 92 54" xmlns="http://www.w3.org/2000/svg">
      <path d="M 12 46 A 34 34 0 0 1 80 46" fill="none" stroke="var(--rule)" stroke-width="7" stroke-linecap="round"/>
      <path d="M 12 46 A 34 34 0 0 1 80 46" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${(pct/100)*106.8} 200"/>
      <circle cx="${cx}" cy="${cy}" r="3.2" fill="var(--ink)"/>
      <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
      <text x="46" y="52" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="var(--steel)">${pct}%</text>
    </svg>`;
  }

  function renderSidebar() {
    const list = document.getElementById("dealList");
    list.innerHTML = state.deals.map(d => {
      const pct = dealProgress(d);
      return `<div class="deal-card ${d.id === state.activeId ? 'active' : ''}" data-deal="${d.id}">
        <div class="deal-card-top">
          <span class="deal-id">${d.id}</span>
          ${d.status === 'closed' ? '<span class="status-pill pill-clear">CLOSED</span>' : ''}
        </div>
        <div class="deal-reg">${d.regNo} · ${d.buyerName}</div>
        <div class="deal-gauge-row">
          <div class="deal-gauge-track"><div class="deal-gauge-fill ${pct===100?'done':''}" style="width:${pct}%"></div></div>
          <div class="deal-pct">${pct}%</div>
        </div>
      </div>`;
    }).join("");

    document.getElementById("statOpen").textContent = state.deals.filter(d => d.status !== "closed").length;
    document.getElementById("statClosed").textContent = state.deals.filter(d => d.status === "closed").length;
    document.getElementById("statDocs").textContent = state.deals.reduce((s, d) => s + d.docs.filter(x=>x.status==="generated").length, 0);
  }

  function renderMain() {
    const deal = getDeal(state.activeId);
    const main = document.getElementById("main");
    if (!deal) { main.innerHTML = ""; return; }
    const pct = dealProgress(deal);

    const checksHtml = deal.checks.map((c, i) => {
      if (deal.scanning && i >= deal.revealedChecks) {
        return `<div class="row-card" style="opacity:0.45"><div class="row-icon icon-locked">•</div>
          <div class="row-body"><div class="row-title">${c.label}</div><div class="row-sub">Queued for check…</div></div></div>`;
      }
      const ic = iconFor(c.status);
      return `<div class="row-card">
        <div class="row-icon icon-${ic.cls}">${ic.glyph}</div>
        <div class="row-body">
          <div class="row-title">${c.label}</div>
          <div class="row-sub ${c.status==='blocked'?'blocked-text':c.status==='pending'?'pending-text':''}">${c.detail}</div>
        </div>
        ${pillFor(c.status)}
      </div>`;
    }).join("");

    const partiesHtml = deal.parties.map(p => {
      const ic = iconFor(p.status);
      const busy = p.__syncing;
      return `<div class="row-card">
        <div class="row-icon icon-${ic.cls}">${busy ? '' : ic.glyph}${busy ? '<span class="dot-flicker"></span>' : ''}</div>
        <div class="row-body">
          <div class="row-title">${p.role} <span style="color:var(--steel);font-weight:400">— ${p.name}</span></div>
          <div class="row-sub ${p.status==='blocked'?'blocked-text':''}">${busy ? 'Syncing with counterparty API…' : (p.status === 'clear' ? 'Confirmed & synced' : 'Awaiting confirmation')}</div>
        </div>
        ${p.status === 'clear'
          ? pillFor('clear')
          : `<button class="row-action" data-sync="${p.id}" ${busy ? 'disabled' : ''}>${busy ? 'Syncing…' : 'Sync'}</button>`}
      </div>`;
    }).join("");

    const docsHtml = deal.docs.map(doc => {
      const ready = canGenerateDoc(deal, doc);
      const status = doc.status === "generated" ? "clear" : (ready ? "pending" : "locked");
      const ic = iconFor(status === "clear" ? "clear" : (ready ? "pending" : "locked"));
      return `<div class="row-card">
        <div class="row-icon icon-${status === 'clear' ? 'clear' : (ready ? 'pending' : 'locked')}">${status === 'clear' ? '✓' : (ready ? '⎘' : '•')}</div>
        <div class="row-body">
          <div class="row-title">${doc.name}</div>
          <div class="row-sub">${doc.status === 'generated' ? 'Generated · ' + doc.generatedAt.toLocaleDateString() : (ready ? 'Ready to generate' : 'Waiting on checks above')}</div>
        </div>
        ${doc.status === 'generated'
          ? `<button class="row-action ghost" data-view="${doc.id}">View</button>`
          : `<button class="row-action ${ready ? 'primary' : ''}" data-gen="${doc.id}" ${ready ? '' : 'disabled'}>Generate</button>`}
      </div>`;
    }).join("");

    const closed = deal.status === "closed";
    const canClose = allClearForClose(deal) && !closed;

    main.innerHTML = `
      <div class="deal-head">
        <div>
          <h1>${deal.regNo}</h1>
          <div class="deal-meta">
            <span>${deal.id}</span><span>VIN ${deal.vin}</span><span>${deal.saleAmount}</span>
          </div>
        </div>
        ${closed ? '<span class="status-pill pill-clear">DEAL CLOSED</span>' : pillFor(pct === 100 ? 'clear' : 'pending')}
      </div>

      <div class="fuel-wrap">
        ${fuelGaugeSvg(pct)}
        <div class="fuel-caption">Sellable readiness — <b>${pct}%</b> of checks, party confirmations and documents complete.</div>
      </div>

      ${deal.scanning ? '<div class="scan-note"><span class="dot-flicker"></span> Running vehicle & buyer compliance scan…</div>' : ''}

      <div class="section">
        <div class="section-title">Vehicle & buyer readiness <span class="section-hint">${deal.checks.filter(c=>c.status==='clear').length}/${deal.checks.length} clear</span></div>
        ${checksHtml}
      </div>

      <div class="section">
        <div class="section-title">Party coordination <span class="section-hint">${deal.parties.filter(p=>p.status==='clear').length}/${deal.parties.length} confirmed</span></div>
        ${partiesHtml}
      </div>

      <div class="section">
        <div class="section-title">Documents <span class="section-hint">${deal.docs.filter(d=>d.status==='generated').length}/${deal.docs.length} issued</span></div>
        ${docsHtml}
        <div id="docPreviewSlot"></div>
      </div>

      ${closed ? `
        <div class="seal-block">
          <div class="seal-ring">✓</div>
          <div class="seal-title">Deal closed & ownership transfer filed</div>
          <div class="seal-sub">${deal.id} · all parties confirmed · ${deal.docs.length} documents on record</div>
        </div>` : `
        <div class="close-bar">
          <div class="close-bar-text">Closing files the ownership transfer and locks the ledger. Every check, party confirmation and document must be cleared first.</div>
          <button class="close-btn" id="closeDealBtn" ${canClose ? '' : 'disabled'}>Close deal</button>
        </div>`}
    `;

    attachMainHandlers(deal);
  }

  function attachMainHandlers(deal) {
    document.querySelectorAll("[data-sync]").forEach(btn => {
      btn.addEventListener("click", () => {
        const pid = btn.getAttribute("data-sync");
        const party = deal.parties.find(p => p.id === pid);
        party.__syncing = true;
        renderMain();
        setTimeout(() => {
          party.__syncing = false;
          party.status = "clear";
          renderMain();
          renderSidebar();
        }, 1100 + Math.random() * 700);
      });
    });

    document.querySelectorAll("[data-gen]").forEach(btn => {
      btn.addEventListener("click", () => {
        const did = btn.getAttribute("data-gen");
        const doc = deal.docs.find(d => d.id === did);
        doc.status = "generated";
        doc.generatedAt = new Date();
        renderMain();
        renderSidebar();
        showDocPreview(deal, doc);
      });
    });

    document.querySelectorAll("[data-view]").forEach(btn => {
      btn.addEventListener("click", () => {
        const did = btn.getAttribute("data-view");
        const doc = deal.docs.find(d => d.id === did);
        showDocPreview(deal, doc);
      });
    });

    const closeBtn = document.getElementById("closeDealBtn");
    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        deal.status = "closed";
        renderMain();
        renderSidebar();
      });
    }
  }

  function showDocPreview(deal, doc) {
    const slot = document.getElementById("docPreviewSlot");
    slot.innerHTML = `<div class="doc-preview">
      <h3>${doc.name}</h3>
      <div class="kv"><span>DEAL</span><span>${deal.id}</span></div>
      <div class="kv"><span>DEALERSHIP</span><span>${deal.dealership}</span></div>
      <div class="kv"><span>VEHICLE REG</span><span>${deal.regNo}</span></div>
      <div class="kv"><span>VIN</span><span>${deal.vin}</span></div>
      <div class="kv"><span>BUYER</span><span>${deal.buyerName} (${deal.buyerPan})</span></div>
      ${doc.id === 'loan_noc' ? `<div class="kv"><span>FINANCIER</span><span>${deal.bank}</span></div>` : ''}
      ${doc.id === 'insurance_transfer' ? `<div class="kv"><span>INSURER</span><span>${deal.insurer}</span></div>` : ''}
      <div class="kv"><span>SALE VALUE</span><span>${deal.saleAmount}</span></div>
      <div class="kv"><span>ISSUED</span><span>${doc.generatedAt.toLocaleString()}</span></div>
      <div class="stamp">✓ auto-generated from cleared deal data — MFA/${doc.id.toUpperCase()}/${deal.id}</div>
    </div>`;
    slot.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ---------------- New deal modal ----------------
  function openNewDealModal() {
    const root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="overlay" id="overlay">
      <div class="modal">
        <h2>Start a new deal</h2>
        <div class="sub">MFA pulls readiness checks the moment a deal is opened.</div>
        <div class="field-row">
          <div class="field"><label>Registration no.</label><input id="f_reg" placeholder="KA 01 XY 1234" value="KA 07 GJ 5540"></div>
          <div class="field"><label>Chassis / VIN</label><input id="f_vin" placeholder="17-character VIN" value="MA3HBEF1S00${Math.floor(100000+Math.random()*899999)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Buyer name</label><input id="f_buyer" placeholder="Full name" value="Sanjay Iyer"></div>
          <div class="field"><label>Buyer PAN</label><input id="f_pan" placeholder="ABCDE1234F" value="AKLPS7723Q"></div>
        </div>
        <div class="field">
          <label>Financier (leave blank if cash purchase)</label>
          <select id="f_bank">
            <option value="">— Cash purchase, no financier —</option>
            <option>HDFC Bank</option>
            <option>Axis Bank</option>
            <option>ICICI Bank</option>
            <option>Bajaj Finserv</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Insurer</label>
            <select id="f_insurer">
              <option>ICICI Lombard</option><option>HDFC Ergo</option><option>Bajaj Allianz</option><option>Tata AIG</option>
            </select>
          </div>
          <div class="field"><label>Sale amount</label><input id="f_amount" placeholder="₹" value="₹7,25,000"></div>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelModal">Cancel</button>
          <button class="btn-primary" id="createDeal">Open deal & run checks</button>
        </div>
      </div>
    </div>`;

    document.getElementById("cancelModal").addEventListener("click", closeModal);
    document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
    document.getElementById("createDeal").addEventListener("click", () => {
      const input = {
        regNo: document.getElementById("f_reg").value.trim() || "UNREGISTERED",
        vin: document.getElementById("f_vin").value.trim() || "UNKNOWNVIN",
        buyerName: document.getElementById("f_buyer").value.trim() || "Unnamed buyer",
        buyerPan: document.getElementById("f_pan").value.trim() || "—",
        bank: document.getElementById("f_bank").value,
        insurer: document.getElementById("f_insurer").value,
        saleAmount: document.getElementById("f_amount").value.trim() || "—"
      };
      dealSeq++;
      const deal = buildDeal(input, 2300 + dealSeq);
      state.deals.unshift(deal);
      state.activeId = deal.id;
      closeModal();
      renderSidebar();
      renderMain();
      runScan(deal);
    });
  }

  function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }

  function runScan(deal) {
    let i = 0;
    const step = () => {
      i++;
      deal.revealedChecks = i;
      renderMain();
      renderSidebar();
      if (i < deal.checks.length) {
        setTimeout(step, 420 + Math.random() * 380);
      } else {
        deal.scanning = false;
        renderMain();
      }
    };
    setTimeout(step, 500);
  }

  // ---------------- Wiring ----------------
  document.getElementById("newDealBtn").addEventListener("click", openNewDealModal);
  document.getElementById("dealList").addEventListener("click", e => {
    const card = e.target.closest("[data-deal]");
    if (!card) return;
    state.activeId = card.getAttribute("data-deal");
    renderSidebar();
    renderMain();
  });

  renderSidebar();
  renderMain();
})();
</script>
</body>
</html>

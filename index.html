<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; padding: 8px; }
    h3 { margin-bottom: 4px; }
    .notice { background: #fff3cd; border: 1px solid #ffe08a; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    label { display: block; margin-top: 8px; font-weight: bold; }
    input[type=text], input[type=number], select, textarea {
      width: 100%; box-sizing: border-box; padding: 4px; margin-top: 2px;
    }
    .question-block { border: 1px solid #ddd; border-radius: 4px; padding: 8px; margin-top: 10px; }
    .question-title { font-weight: bold; }
    .question-type { color: #666; font-size: 11px; }
    button { margin-top: 12px; padding: 8px 12px; cursor: pointer; }
    #results { margin-top: 12px; max-height: 200px; overflow-y: auto; }
    .row-success { color: #1a7f37; }
    .row-error { color: #cf222e; }
    .unsupported { color: #999; font-style: italic; }
    .qr-section { border: 1px solid #ddd; border-radius: 4px; padding: 8px; margin-top: 8px; }
    .qr-buttons button { margin-top: 6px; margin-right: 6px; padding: 6px 10px; }
    #qrVideo { width: 100%; margin-top: 6px; display: none; border-radius: 4px; }
    .qr-status { font-size: 11px; margin-top: 4px; }
    .qr-status.ok { color: #1a7f37; }
    .qr-status.err { color: #cf222e; }
  </style>
</head>
<body>
  <div class="notice">
    For testing / QA / development on forms you own only. Works via the
    official Apps Script Forms API — it cannot run against a form you
    don't have edit access to.
  </div>

  <h3>1. Load a form</h3>
  <label>Form URL or ID</label>
  <input type="text" id="formUrl" placeholder="https://docs.google.com/forms/d/....">

  <div class="qr-section">
    <div><strong>Or scan a QR code of the form link</strong></div>
    <div class="qr-buttons">
      <button onclick="startCameraScan()" id="camBtn">Scan with camera</button>
      <button onclick="document.getElementById('qrFile').click()">Upload QR image</button>
      <input type="file" id="qrFile" accept="image/*" style="display:none" onchange="handleQrFile(event)">
    </div>
    <video id="qrVideo" playsinline></video>
    <canvas id="qrCanvas" style="display:none;"></canvas>
    <div id="qrStatus" class="qr-status"></div>
  </div>

  <button onclick="loadForm()">Load Questions</button>

  <div id="formTitle"></div>
  <div id="questions"></div>

  <div id="generateSection" style="display:none;">
    <h3>2. Generate responses</h3>
    <label>Number of test responses (max 500)</label>
    <input type="number" id="count" value="5" min="1" max="500">
    <label>Delay between submissions (ms, min 200)</label>
    <input type="number" id="delay" value="300" min="200">
    <button onclick="generate()">Generate & Submit</button>
  </div>

  <div id="results"></div>

  <!-- jsQR: pure client-side QR decoding, no camera permission required for the upload path -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    let currentQuestions = [];
    let qrStream = null;
    let qrScanLoopId = null;

    function setQrStatus(msg, ok) {
      const el = document.getElementById('qrStatus');
      el.textContent = msg;
      el.className = 'qr-status ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
    }

    // Pulls a plausible Google Forms URL out of decoded QR text and fills the input.
    function applyDecodedUrl(text) {
      const isFormsLink = /docs\.google\.com\/forms|forms\.gle/i.test(text);
      if (!isFormsLink) {
        setQrStatus('QR code scanned, but it doesn\'t look like a Google Forms link: ' + text, false);
        return;
      }
      document.getElementById('formUrl').value = text.trim();
      setQrStatus('Form link scanned successfully.', true);
      loadForm();
    }

    // ---- Option A: upload an image containing the QR code ----
    function handleQrFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      setQrStatus('Decoding image...');

      const img = new Image();
      img.onload = function () {
        const canvas = document.getElementById('qrCanvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) {
          applyDecodedUrl(code.data);
        } else {
          setQrStatus('No QR code found in that image. Try a clearer photo/screenshot.', false);
        }
      };
      img.onerror = function () {
        setQrStatus('Could not read that image file.', false);
      };
      img.src = URL.createObjectURL(file);
    }

    // ---- Option B: live camera scan ----
    // Note: Apps Script sidebars run in a nested iframe, and Google's
    // permissions policy sometimes blocks camera access there even if the
    // browser would normally allow it. If this fails, use "Upload QR image"
    // instead — it always works since it needs no camera permission.
    function startCameraScan() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setQrStatus('Camera access isn\'t available in this context. Use "Upload QR image" instead.', false);
        return;
      }
      setQrStatus('Requesting camera access...');
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function (stream) {
          qrStream = stream;
          const video = document.getElementById('qrVideo');
          video.srcObject = stream;
          video.style.display = 'block';
          video.play();
          setQrStatus('Point the camera at the QR code...');
          qrScanLoopId = requestAnimationFrame(scanCameraFrame);
        })
        .catch(function (err) {
          setQrStatus('Camera blocked in this sidebar (' + err.message + '). Use "Upload QR image" instead.', false);
        });
    }

    function stopCameraScan() {
      if (qrScanLoopId) cancelAnimationFrame(qrScanLoopId);
      if (qrStream) qrStream.getTracks().forEach(function (t) { t.stop(); });
      document.getElementById('qrVideo').style.display = 'none';
      qrStream = null;
      qrScanLoopId = null;
    }

    function scanCameraFrame() {
      const video = document.getElementById('qrVideo');
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const canvas = document.getElementById('qrCanvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) {
          stopCameraScan();
          applyDecodedUrl(code.data);
          return;
        }
      }
      qrScanLoopId = requestAnimationFrame(scanCameraFrame);
    }

    function loadForm() {
      const url = document.getElementById('formUrl').value;
      document.getElementById('questions').innerHTML = 'Loading...';
      google.script.run
        .withSuccessHandler(renderForm)
        .withFailureHandler(function (err) {
          document.getElementById('questions').innerHTML =
            '<div class="row-error">Error: ' + err.message + '</div>';
        })
        .getFormStructure(url);
    }

    function renderForm(data) {
      currentQuestions = data.questions;
      document.getElementById('formTitle').innerHTML = '<h4>' + data.title + '</h4>';

      let html = '';
      data.questions.forEach(function (q, i) {
        html += '<div class="question-block">';
        html += '<div class="question-title">' + q.title + '</div>';
        html += '<div class="question-type">' + q.type + '</div>';

        if (q.unsupported) {
          html += '<div class="unsupported">Unsupported type — will be left blank.</div>';
        } else {
          html += '<label>Answer strategy</label>';
          html += '<select id="mode_' + i + '" onchange="toggleMode(' + i + ')">';
          html += '<option value="random">Random (sensible default)</option>';
          html += '<option value="fixed">Fixed value (same every time)</option>';
          html += '<option value="list">List (cycles through values)</option>';
          html += '</select>';

          if (q.choices) {
            html += '<div class="question-type">Choices: ' + q.choices.join(', ') + '</div>';
          }
          if (q.lower !== undefined) {
            html += '<div class="question-type">Scale: ' + q.lower + '–' + q.upper + '</div>';
          }

          html += '<input type="text" id="fixed_' + i + '" style="display:none" placeholder="Fixed value">';
          html += '<textarea id="list_' + i + '" style="display:none" placeholder="One value per line"></textarea>';
        }
        html += '</div>';
      });

      document.getElementById('questions').innerHTML = html;
      document.getElementById('generateSection').style.display = 'block';
    }

    function toggleMode(i) {
      const mode = document.getElementById('mode_' + i).value;
      document.getElementById('fixed_' + i).style.display = mode === 'fixed' ? 'block' : 'none';
      document.getElementById('list_' + i).style.display = mode === 'list' ? 'block' : 'none';
    }

    function buildAnswerConfigs() {
      const configs = {};
      currentQuestions.forEach(function (q, i) {
        if (q.unsupported) return;
        const modeEl = document.getElementById('mode_' + i);
        const mode = modeEl.value;
        const config = { mode: mode };
        if (mode === 'fixed') {
          config.fixedValue = document.getElementById('fixed_' + i).value;
        } else if (mode === 'list') {
          config.valueList = document.getElementById('list_' + i).value
            .split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        }
        configs[i] = config;
      });
      return configs;
    }

    function generate() {
      const url = document.getElementById('formUrl').value;
      const count = document.getElementById('count').value;
      const delay = document.getElementById('delay').value;
      const configs = buildAnswerConfigs();

      document.getElementById('results').innerHTML = 'Submitting...';
      google.script.run
        .withSuccessHandler(renderResults)
        .withFailureHandler(function (err) {
          document.getElementById('results').innerHTML =
            '<div class="row-error">Error: ' + err.message + '</div>';
        })
        .generateResponses(url, count, configs, delay);
    }

    function renderResults(results) {
      let html = '<h4>Results</h4>';
      results.forEach(function (r) {
        const cls = r.status === 'success' ? 'row-success' : 'row-error';
        html += '<div class="' + cls + '">#' + r.submission + ': ' + r.status + ' — ' + r.message + '</div>';
      });
      const successCount = results.filter(function (r) { return r.status === 'success'; }).length;
      html += '<p><strong>' + successCount + ' / ' + results.length + ' submitted successfully.</strong></p>';
      document.getElementById('results').innerHTML = html;
    }
  </script>
</body>
</html>

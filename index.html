<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manatune Net — meet people around you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1b1e; --surface:#142a2e; --surface2:#1c363b; --border:#25454a;
  --text:#eef5f3; --muted:#8fa8a4; --accent:#ff6b4a; --accent2:#4ade9c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f2ec; --surface:#ffffff; --surface2:#eef0ea; --border:#e1ddd2;
    --text:#16211f; --muted:#6b7674; --accent:#e05a3d; --accent2:#1f9d6b;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1b1e; --surface:#142a2e; --surface2:#1c363b; --border:#25454a;
  --text:#eef5f3; --muted:#8fa8a4; --accent:#ff6b4a; --accent2:#4ade9c;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
  min-height:100%; overflow-x:hidden;
}
h1,h2,h3,.brand,.big-name{font-family:'Space Grotesk',system-ui,sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* ---------- Onboarding ---------- */
.screen{padding:24px 20px 100px;flex:1;}
.brand{font-size:22px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;padding-top:12px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb, var(--accent2) 25%, transparent);}
.tag{color:var(--muted);font-size:14px;margin:6px 0 28px;line-height:1.5;}
label{display:block;font-size:13px;color:var(--muted);margin:18px 0 6px;}
input[type=text], textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:12px;font-size:15px;font-family:inherit;
}
textarea{resize:vertical;min-height:64px;}
.avatars{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
.avatar-opt{
  width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;
}
.avatar-opt.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, var(--surface));}
.btn{
  width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;margin-top:22px;
}
.btn-primary{background:var(--accent);color:#0d1b1e;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.loc-status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;}

/* ---------- Radar ---------- */
.radar-wrap{display:flex;justify-content:center;padding:10px 0 4px;}
.radar{width:280px;height:280px;position:relative;border-radius:50%;
  background:radial-gradient(circle, var(--surface2) 0%, var(--surface) 70%, transparent 71%);
}
.ring{position:absolute;border:1px solid var(--border);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);}
.you-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;
  background:var(--accent2);box-shadow:0 0 0 6px color-mix(in srgb, var(--accent2) 20%, transparent);z-index:3;}
.pdot{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--surface2);
  border:2px solid var(--border);cursor:pointer;z-index:2;}
.pdot.interested{border-color:var(--accent);}
.radar-caption{text-align:center;color:var(--muted);font-size:12px;margin:8px 0 18px;}

/* ---------- List ---------- */
.section-title{font-size:13px;color:var(--muted);margin:0 0 10px;}
.card{
  display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;
}
.avatar-badge{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.card-info{flex:1;min-width:0;}
.card-name{font-size:15px;font-weight:600;}
.card-sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.heart-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;flex-shrink:0;}
.heart-btn.on{background:var(--accent);border-color:var(--accent);}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 10px;}

/* ---------- Profile overlay ---------- */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));}
.overlay-inner{max-width:480px;margin:0 auto;padding:0 20px;}
.back-btn{background:none;border:none;color:var(--text);font-size:15px;cursor:pointer;padding:6px 0;margin-bottom:10px;}
.big-avatar{width:100px;height:100px;border-radius:28px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:16px;}
.big-name{font-size:24px;font-weight:700;}
.big-sub{color:var(--muted);font-size:14px;margin-top:4px;}
.bio{margin-top:18px;font-size:15px;line-height:1.6;}

/* ---------- Bottom nav ---------- */
.tabbar{
  position:sticky;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));
}
.tab{flex:1;text-align:center;background:none;border:none;color:var(--muted);font-size:12px;padding:6px;cursor:pointer;font-family:inherit;}
.tab .ic{font-size:19px;display:block;margin-bottom:2px;}
.tab.active{color:var(--accent);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  let state = { screen:'onboarding', tab:'discover', me:null, viewing:null, interested:new Set() };

  const AVATARS = ['🙂','😎','🌟','🌊','🦊','🌸','🎧','☕','🌿','🔥','🐼','🎨'];
  const NAMES = [
    ['Maya',27,'🌸','Here for the coffee, staying for the conversation. Into hiking and bad puns.'],
    ['Jordan',31,'🎧','Producer by night, brunch enthusiast by morning. Ask me about my playlists.'],
    ['Sam',24,'🌊','Just moved to the area — looking for people to explore it with.'],
    ['Priya',29,'🌿','Plant mom, occasional rock climber. Will talk your ear off about houseplants.'],
    ['Leo',33,'🔥','Chef on weekdays, chess hustler on weekends.'],
    ['Ava',26,'🐼','Dog person, museum wanderer, currently learning pottery.'],
    ['Noah',30,'🎨','Sketching strangers in coffee shops. Might sketch you.'],
    ['Ivy',28,'☕','Trying every espresso bar in town, one cortado at a time.'],
    ['Ethan',25,'🦊','Amateur astronomer. I know an embarrassing number of constellations.'],
    ['Zoe',32,'🌟','Weekend farmer's-market regular. Let's split a pastry.']
  ];

  function loadLocal(){
    try{
      const raw = localStorage.getItem('nearby_me');
      if(raw){ const d = JSON.parse(raw); state.me = d.me; state.interested = new Set(d.interested||[]); }
    }catch(e){}
  }
  function saveLocal(){
    try{ localStorage.setItem('nearby_me', JSON.stringify({me:state.me, interested:[...state.interested]})); }catch(e){}
  }

  function metersOffset(lat,lng,distKm,bearingDeg){
    const R=6371, br=bearingDeg*Math.PI/180, d=distKm/R;
    const lat1=lat*Math.PI/180, lng1=lng*Math.PI/180;
    const lat2=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(br));
    const lng2=lng1+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
    return [lat2*180/Math.PI, lng2*180/Math.PI];
  }
  function haversine(lat1,lng1,lat2,lng2){
    const R=6371, toRad=x=>x*Math.PI/180;
    const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
    const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function genProfiles(lat,lng){
    let seed=42;
    const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
    return NAMES.map((n,i)=>{
      const dist = 0.3 + rnd()*4.7;
      const bearing = rnd()*360;
      const [plat,plng] = metersOffset(lat,lng,dist,bearing);
      return {id:'p'+i, name:n[0], age:n[1], avatar:n[2], bio:n[3], lat:plat, lng:plng, dist:Math.round(dist*10)/10};
    }).sort((a,b)=>a.dist-b.dist);
  }

  function render(){
    if(state.screen==='onboarding'){ app.innerHTML = onboardingView(); bindOnboarding(); return; }
    app.innerHTML = mainView();
    bindMain();
    if(state.viewing) renderOverlay();
  }

  function onboardingView(){
    const d = state.draft || {name:'', avatar:AVATARS[0], bio:''};
    return `
    <div class="screen">
      <div class="brand"><span class="dot"></span> Manatune Net</div>
      <p class="tag">Meet people who are out and about near you, right now. Log in by sharing your name and your live location.</p>
      <label>Your name</label>
      <input type="text" id="in-name" value="${d.name}" placeholder="e.g. Alex">
      <label>Pick an avatar</label>
      <div class="avatars" id="avatar-row">
        ${AVATARS.map(a=>`<div class="avatar-opt ${a===d.avatar?'selected':''}" data-a="${a}">${a}</div>`).join('')}
      </div>
      <label>Short bio</label>
      <textarea id="in-bio" placeholder="A line about you...">${d.bio}</textarea>
      <button class="btn btn-primary" id="btn-locate">Share my location & find people nearby</button>
      <div class="loc-status" id="loc-status"></div>
    </div>`;
  }

  function bindOnboarding(){
    if(!state.draft) state.draft = {name:'', avatar:AVATARS[0], bio:''};
    document.getElementById('in-name').oninput = e=> state.draft.name = e.target.value;
    document.getElementById('in-bio').oninput = e=> state.draft.bio = e.target.value;
    document.querySelectorAll('.avatar-opt').forEach(el=>{
      el.onclick = ()=>{ state.draft.avatar = el.dataset.a; render(); };
    });
    document.getElementById('btn-locate').onclick = ()=>{
      const status = document.getElementById('loc-status');
      const name = state.draft.name.trim() || 'You';
      const finish = (lat,lng,note)=>{
        state.me = {name, avatar:state.draft.avatar, bio: state.draft.bio.trim() || 'New here 👋', lat, lng};
        state.profiles = genProfiles(lat,lng);
        state.screen='main'; state.tab='discover';
        saveLocal(); render();
      };
      if(!navigator.geolocation){
        status.textContent = 'Location isn\\'t available on this device — using an approximate spot instead.';
        finish(40.7128,-74.0060);
        return;
      }
      status.textContent = 'Getting your location…';
      navigator.geolocation.getCurrentPosition(
        pos=> finish(pos.coords.latitude, pos.coords.longitude),
        err=>{ status.textContent = 'Couldn\\'t get your exact location, using an approximate spot.'; finish(40.7128,-74.0060); },
        {timeout:8000}
      );
    };
  }

  function mainView(){
    return `
    <div class="screen" id="tab-content" style="padding-bottom:90px;"></div>
    <div class="tabbar">
      <button class="tab ${state.tab==='discover'?'active':''}" data-t="discover"><span class="ic">📡</span>Discover</button>
      <button class="tab ${state.tab==='interested'?'active':''}" data-t="interested"><span class="ic">💛</span>Interested</button>
      <button class="tab ${state.tab==='you'?'active':''}" data-t="you"><span class="ic">🙂</span>You</button>
    </div>`;
  }

  function bindMain(){
    document.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{ state.tab=t.dataset.t; render(); });
    const c = document.getElementById('tab-content');
    if(state.tab==='discover') c.innerHTML = discoverView();
    if(state.tab==='interested') c.innerHTML = interestedView();
    if(state.tab==='you') c.innerHTML = youView();
    bindCards();
  }

  function radarHTML(profiles){
    const rings = [90,140,190,240].map(s=>`<div class="ring" style="width:${s}px;height:${s}px;"></div>`).join('');
    const maxDist = 5;
    const dots = profiles.map(p=>{
      const angle = (parseInt(p.id.slice(1))*37)%360 * Math.PI/180;
      const r = Math.min(p.dist/maxDist,1) * 120;
      const x = 140 + r*Math.cos(angle), y = 140 + r*Math.sin(angle);
      return `<div class="pdot ${state.interested.has(p.id)?'interested':''}" style="left:${x}px;top:${y}px;" data-id="${p.id}">${p.avatar}</div>`;
    }).join('');
    return `<div class="radar-wrap"><div class="radar">${rings}<div class="you-dot"></div>${dots}</div></div>
    <p class="radar-caption">You, and ${profiles.length} people nearby right now</p>`;
  }

  function discoverView(){
    const profiles = state.profiles;
    return radarHTML(profiles) + `<p class="section-title">Nearby</p>` +
      profiles.map(p=> cardHTML(p)).join('');
  }
  function interestedView(){
    const list = state.profiles.filter(p=> state.interested.has(p.id));
    if(!list.length) return `<p class="section-title">Interested</p><div class="empty">You haven't shown interest in anyone yet.<br>Head to Discover to find people nearby.</div>`;
    return `<p class="section-title">People you're interested in</p>` + list.map(p=>cardHTML(p)).join('');
  }
  function youView(){
    const m = state.me;
    return `
    <p class="section-title">Your profile</p>
    <div class="card" style="cursor:default;">
      <div class="avatar-badge">${m.avatar}</div>
      <div class="card-info"><div class="card-name">${escapeHtml(m.name)}</div><div class="card-sub">${escapeHtml(m.bio)}</div></div>
    </div>
    <p class="section-title" style="margin-top:22px;">Location</p>
    <div class="card" style="cursor:default;">
      <div class="avatar-badge">📍</div>
      <div class="card-info"><div class="card-name">Sharing live location</div><div class="card-sub">${m.lat.toFixed(3)}, ${m.lng.toFixed(3)}</div></div>
    </div>
    <button class="btn btn-ghost" id="btn-logout">Log out</button>`;
  }

  function cardHTML(p){
    const on = state.interested.has(p.id);
    return `<div class="card" data-view="${p.id}">
      <div class="avatar-badge">${p.avatar}</div>
      <div class="card-info"><div class="card-name">${p.name}, ${p.age}</div><div class="card-sub">${p.dist} km away</div></div>
      <div class="heart-btn ${on?'on':''}" data-heart="${p.id}">${on?'💛':'🤍'}</div>
    </div>`;
  }

  function bindCards(){
    document.querySelectorAll('[data-view]').forEach(el=>{
      el.addEventListener('click', e=>{
        if(e.target.closest('[data-heart]')) return;
        state.viewing = el.dataset.view; render();
      });
    });
    document.querySelectorAll('[data-heart]').forEach(el=>{
      el.onclick = e=>{
        e.stopPropagation();
        const id = el.dataset.heart;
        if(state.interested.has(id)) state.interested.delete(id); else state.interested.add(id);
        saveLocal(); render();
      };
    });
    const lo = document.getElementById('btn-logout');
    if(lo) lo.onclick = ()=>{
      state.me=null; state.profiles=[]; state.interested=new Set(); state.draft=null;
      try{ localStorage.removeItem('nearby_me'); }catch(e){}
      state.screen='onboarding'; render();
    };
  }

  function renderOverlay(){
    const p = state.profiles.find(x=>x.id===state.viewing);
    const on = state.interested.has(p.id);
    const div = document.createElement('div');
    div.className='overlay';
    div.innerHTML = `<div class="overlay-inner">
      <button class="back-btn" id="ov-back">← Back</button>
      <div class="big-avatar">${p.avatar}</div>
      <div class="big-name">${p.name}, ${p.age}</div>
      <div class="big-sub">${p.dist} km away · nearby now</div>
      <div class="bio">${escapeHtml(p.bio)}</div>
      <div class="heart-btn ${on?'on':''}" id="ov-heart" style="width:100%;border-radius:14px;margin-top:24px;height:48px;">${on?'💛 Interested':'🤍 Show interest'}</div>
    </div>`;
    app.appendChild(div);
    div.querySelector('#ov-back').onclick = ()=>{ state.viewing=null; div.remove(); };
    div.querySelector('#ov-heart').onclick = ()=>{
      if(state.interested.has(p.id)) state.interested.delete(p.id); else state.interested.add(p.id);
      saveLocal(); state.viewing=null; div.remove(); render();
    };
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  loadLocal();
  if(state.me){ state.profiles = genProfiles(state.me.lat, state.me.lng); state.screen='main'; }
  render();
})();
</script>
</body>
</html>

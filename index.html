<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal &amp; Constitutional History</title>
<style>
:root{
  --ink:#1c140d; --parchment:#f4ecd8; --parchment2:#eadfc4;
  --maroon:#5c1a1a; --maroon2:#7a2323; --gold:#b8860b; --goldlight:#d4af37;
  --line:#c9b892;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f1e6cf; --parchment:#241a12; --parchment2:#2c2116;
    --maroon:#c65a5a; --maroon2:#e07a7a; --gold:#e0b84d; --goldlight:#f0cf6a; --line:#4a3c28;
  }
}
:root[data-theme="dark"]{
  --ink:#f1e6cf; --parchment:#241a12; --parchment2:#2c2116;
  --maroon:#c65a5a; --maroon2:#e07a7a; --gold:#e0b84d; --goldlight:#f0cf6a; --line:#4a3c28;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  height:100%; margin:0; background:var(--parchment); color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
  display:flex; flex-direction:column;
}
header{
  padding:calc(10px + env(safe-area-inset-top,0px)) 4vw 10px;
  display:flex; align-items:center; gap:12px;
  border-bottom:2px solid var(--gold);
  background:linear-gradient(180deg,var(--parchment2),var(--parchment));
}
header .crest{font-size:clamp(1.2em,2.2vw,2em);}
header h1{font-size:clamp(.9em,1.8vw,1.6em); margin:0; letter-spacing:.5px; color:var(--maroon2); font-weight:normal; font-variant:small-caps;}
main{flex:1; overflow:hidden; position:relative; max-width:1400px; width:100%; margin:0 auto;}
.slide{
  position:absolute; inset:0; padding:clamp(16px,4vh,40px) 6vw 110px; overflow-y:auto;
  opacity:0; visibility:hidden; transform:translateX(16px);
  transition:opacity .25s ease, transform .25s ease;
  font-size:clamp(1em,1.4vw,1.5em);
}
.slide.active{opacity:1; visibility:visible; transform:translateX(0);}
.slide h2{
  color:var(--maroon); font-size:clamp(1.3em,2.6vw,2.2em); margin:0 0 6px; font-variant:small-caps;
  border-bottom:1px solid var(--line); padding-bottom:10px;
}
.slide .sub{color:var(--gold); font-style:italic; margin:0 0 18px; font-size:.9em;}
.slide p{line-height:1.55; margin:0 0 12px; max-width:60em;}
.slide ul{margin:0 0 12px 0; padding-left:1.2em; line-height:1.55;}
.slide li{margin-bottom:6px;}
table{width:100%; border-collapse:collapse; margin:10px 0 16px; font-size:.85em;}
.slide{overflow-x:hidden;}
table{display:block; overflow-x:auto; white-space:normal;}
th,td{border:1px solid var(--line); padding:8px 12px; text-align:left; vertical-align:top;}
th{background:var(--maroon); color:var(--parchment); font-variant:small-caps;}
tr:nth-child(even) td{background:var(--parchment2);}
.flow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0 16px;}
.chip{background:var(--parchment2); border:1px solid var(--gold); border-radius:14px; padding:5px 12px; font-size:.8em;}
.arrow{color:var(--gold); font-weight:bold;}
.hier{display:flex; flex-direction:column; gap:6px; margin:10px 0;}
.hier div{background:var(--parchment2); border-left:4px solid var(--maroon); padding:10px 14px; font-size:.9em;}
.title-slide{display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; height:100%;}
.title-slide .crest-big{font-size:clamp(2em,7vw,5em); margin-bottom:6px;}
.title-slide h2{border:none; font-size:clamp(1.5em,4vw,3em); color:var(--maroon);}
.title-slide .sub{font-size:1.1em;}
nav.controls{
  position:fixed; left:0; right:0; bottom:0;
  padding:12px 4vw calc(14px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:linear-gradient(0deg,var(--parchment2),transparent);
}
button.nb{
  font-family:Georgia,serif; font-variant:small-caps; letter-spacing:.5px;
  background:var(--maroon); color:var(--parchment); border:1px solid var(--gold);
  border-radius:8px; padding:14px 22px; font-size:clamp(.9em,1.6vw,1.2em); cursor:pointer;
  min-width:44px; min-height:44px; touch-action:manipulation;
}
button.nb:disabled{opacity:.35; cursor:default;}
.counter{font-size:clamp(.8em,1.4vw,1.1em); color:var(--maroon2); font-variant:small-caps;}
.dots{display:flex; gap:5px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--gold);}
@media (min-width:1600px){ header h1{font-size:1.8em;} }
</style>
</head>
<body>
<header><span class="crest">⚖️</span><h1>Legal &amp; Constitutional History of India</h1></header>
<main id="main"></main>
<nav class="controls">
  <button class="nb" id="prev">◀ Prev</button>
  <div class="counter" id="counter"></div>
  <button class="nb" id="next">Next ▶</button>
</nav>

<script>
const slides = [
`<div class="title-slide">
  <div class="crest-big">⚖️</div>
  <h2>Legal &amp; Constitutional History</h2>
  <p class="sub">Framework · Ancient India · Medieval (Sultanate) Judicial System</p>
</div>`,

`<h2>Framework: Two Histories</h2>
<p class="sub">Legal History vs Constitutional History</p>
<p><strong>Legal History</strong> = History of Law + Courts + Justice</p>
<div class="flow">
<span class="chip">Ancient Courts</span><span class="arrow">→</span>
<span class="chip">Medieval Courts</span><span class="arrow">→</span>
<span class="chip">Company Courts</span><span class="arrow">→</span>
<span class="chip">Supreme Court (Calcutta)</span><span class="arrow">→</span>
<span class="chip">High Courts</span><span class="arrow">→</span>
<span class="chip">Federal Court</span><span class="arrow">→</span>
<span class="chip">Supreme Court of India</span>
</div>
<p><strong>Constitutional History</strong> = History of Government + Political Power + Constitutional Institutions</p>
<div class="flow">
<span class="chip">EIC</span><span class="arrow">→</span>
<span class="chip">Parliament controls Company</span><span class="arrow">→</span>
<span class="chip">Crown Rule</span><span class="arrow">→</span>
<span class="chip">Legislative Councils</span><span class="arrow">→</span>
<span class="chip">Indian Participation</span><span class="arrow">→</span>
<span class="chip">Provincial Autonomy</span><span class="arrow">→</span>
<span class="chip">Independence</span><span class="arrow">→</span>
<span class="chip">Constituent Assembly</span><span class="arrow">→</span>
<span class="chip">Constitution of India</span>
</div>
<p><strong>Basic problem:</strong> how do we resolve disputes &amp; maintain social order? Different societies answered this differently.</p>
<p><strong>Law</strong> = a system of rules recognised and enforced by an authority to regulate conduct in society — addressing Rules, Institutions, Rights, Duties, Procedures, Courts, Enforcement.</p>`,

`<h2>Five Major Historical Stages</h2>
<table>
<tr><th>Stage</th><th>Period</th><th>Key Features</th></tr>
<tr><td>I</td><td>Ancient India</td><td>Dharma, Dharmashastra, King, Custom, Community Institutions, Royal Justice</td></tr>
<tr><td>II</td><td>Medieval India</td><td>Sultan, Mughal Emperor, Sharia, Qazi, Mufti, Islamic Judicial Institutions, Local Customs</td></tr>
<tr><td>III</td><td>EIC</td><td>Charter, Company, Presidency, Mayor's Court, Adalat, Governor, Council</td></tr>
<tr><td>IV</td><td>British Crown</td><td>Supreme Court, High Courts, Privy Council, Federal Court, Regulating Act, Pitt's India Act, GOI Acts</td></tr>
<tr><td>V</td><td>Constitutional India</td><td>Independence, Constituent Assembly, Drafting Committee, Constitution, Fundamental Rights, Parliament</td></tr>
</table>`,

`<h2>Stage I: Ancient Legal System</h2>
<p class="sub">Social Order &amp; Dharma</p>
<p>Social order rested on two pillars:</p>
<ul><li>Caste System</li><li>Joint Family System</li></ul>
<p>→ These led to inequality before law for different castes.</p>
<p><strong>Dharma</strong> — the most important constituent of Hindu thought, broader than "religion." Covers duty, morality, social order, appropriate conduct, obligation, justice, religious norms, and the duties of rulers &amp; subjects.</p>`,

`<h2>Rajadharma &amp; Dharmashastra</h2>
<p class="sub">The King's Duty &amp; the Texts of Law</p>
<p><strong>Rajadharma (King's Duty):</strong></p>
<ul>
<li>Protection of subjects</li><li>Maintenance of order</li>
<li>Administration of justice</li><li>Protection of property</li>
<li>Punishment of wrongdoers</li><li>Preservation of social order</li>
</ul>
<p><strong>Dharmashastra</strong> — texts laying down dharma & rules of conduct: duties, family, inheritance, property, contract, offences, punishment, kingship, judicial procedure.</p>
<p><strong>Key texts:</strong> Manava Dharmashastra (Manusmriti) · Yajnavalkya Smriti · Narada Smriti</p>`,

`<h2>Five Sources of Law</h2>
<table>
<tr><th>Source</th><th>Description</th></tr>
<tr><td>1. Shruti</td><td>Sacred revelation — Vedas, Brahmanas, Aranyakas, Upanishads ("heard," transmitted orally by Rishis)</td></tr>
<tr><td>2. Smriti</td><td>Remembered tradition &amp; authoritative texts — the Dharmashastras</td></tr>
<tr><td>3. Custom</td><td>Accepted practices</td></tr>
<tr><td>4. Royal Authority</td><td>Orders and decisions of rulers</td></tr>
<tr><td>5. Local Practices</td><td>Community-specific rules &amp; institutions</td></tr>
</table>
<p class="sub">Content of Key Dharmashastra Texts</p>
<table>
<tr><th>Text</th><th>Content</th></tr>
<tr><td>Manusmriti</td><td>Social duties, kingship, judicial administration, offences, punishment, property, inheritance, social relations</td></tr>
<tr><td>Yajnavalkya Smriti</td><td>Judicial procedure, civil disputes, evidence, punishment, king's duties</td></tr>
<tr><td>Narada Smriti</td><td>Disputes, courts, evidence, debt, property, contracts, procedure</td></tr>
</table>`,

`<h2>Administration of Justice</h2>
<p class="sub">Ancient India</p>
<p>The institutional process through which legal disputes are heard, decided, and enforced — courts, judges, procedure, evidence, judgment, enforcement &amp; punishment.</p>
<p><strong>King as Administrator of Justice</strong> — occupied the central position. Not meant to act on personal preference; an ideal king administered justice according to accepted norms of Dharma.</p>
<p><strong>Duties of the King:</strong></p>
<ul>
<li>Administer Justice — resolve disputes &amp; punish offenders</li>
<li>Protect Property — maintain social &amp; economic order</li>
<li>Maintain Public Order — prevent disorder &amp; conflict</li>
<li>Uphold Dharma — ruler's legitimacy linked to proper governance</li>
</ul>`,

`<h2>Judicial Institutions</h2>
<p class="sub">Ancient India — Hierarchy (bottom → top)</p>
<div class="hier">
<div><strong>Kula</strong> — family/group-based forum (community-level resolution wherever possible)</div>
<div><strong>Shreni</strong> — guild/occupation/community institution (internal self-regulation)</div>
<div><strong>Puga</strong> — association/group belonging to a locality</div>
<div><strong>Royal Judicial Officers</strong></div>
<div><strong>King (Royal Court)</strong> — reached when lower institutions failed, disputes were significant, on appeal, or royal authority was required</div>
</div>`,

`<h2>Stage II: Medieval India</h2>
<p class="sub">Administrative / Judicial Division — State Level</p>
<ul>
<li><strong>Diwan-e-Mazalim</strong> — highest court of criminal appeal, headed by Sadr-e-Jahan</li>
<li><strong>Diwan-e-Risalat</strong> — highest court of civil appeal, headed by Sadr-e-Jahan</li>
<li><strong>King's Court</strong> — Sultan</li>
<li><strong>Chief Justice's Court</strong> — Qazi-ul-Quzat — all kinds of cases</li>
<li><strong>Sadr-e-Jahan's Court</strong> — ecclesiastical (church) cases</li>
<li><strong>Diwan-e-Siyasat</strong> — introduced by Muhammad-bin-Tughlaq</li>
</ul>
<p>The Sultan was regarded as the <strong>"Fountain (Foundation) of Justice."</strong></p>`,

`<h2>Medieval India — Provincial Level</h2>
<ul>
<li><strong>Adalat Nazim-e-Subah</strong> (Governor's Court) — original &amp; appellate jurisdiction</li>
<li><strong>Adalat Qazi-e-Subah</strong> (Chief Provincial Qazi) — highest court of appeal in the province, original jurisdiction</li>
<li><strong>Diwan-e-Subah</strong> — Revenue Court; also the provincial Finance Minister</li>
<li><strong>Sadr-e-Subah</strong> — ecclesiastical court (church matters)</li>
</ul>`,

`<h2>Medieval India — District Level (Sarkar)</h2>
<p class="sub">Highest Justice Department</p>
<p><strong>Court of Qazi</strong> — hears all civil &amp; criminal matters, and appeals from:</p>
<ul>
<li>Pargana Qazis (Islamic judges/magistrates at sub-district level)</li>
<li>Kotwal (chief police officer, fort guard/town magistrate)</li>
<li>Village panchayat</li>
</ul>
<p class="sub">Court Staff</p>
<table>
<tr><th>Role</th><th>Function</th></tr>
<tr><td>Kaatib</td><td>Writer of evidence / statements</td></tr>
<tr><td>Faqih</td><td>Writer of legal opinion (scholar / mufti)</td></tr>
<tr><td>Nazir</td><td>In charge of establishment</td></tr>
<tr><td>Sub-ordinate Clerks</td><td>General clerical support</td></tr>
<tr><td>Bargandaz</td><td>Armed guard</td></tr>
<tr><td>Akhbar Navis</td><td>Journalist / news writer — recorded daily court proceedings</td></tr>
</table>`,

`<h2>Executive &amp; Financial Roles</h2>
<p class="sub">District Level, continued</p>
<ul>
<li><strong>Faujdar</strong> — executive head with district-level responsibilities; with Kotwals, empowered to try petty criminal cases. Appeals go to the Governor.</li>
<li><strong>Amil</strong> — state financial administrator; appeals on land revenue matters go to Diwan-e-Subah.</li>
</ul>
<p style="margin-top:30px; color:var(--gold); font-style:italic; text-align:center;">— End of Notes —</p>`
];

let idx = 0;
const main = document.getElementById('main');
slides.forEach((html,i)=>{
  const d = document.createElement('div');
  d.className = 'slide' + (i===0 ? ' active':'');
  d.innerHTML = html;
  main.appendChild(d);
});
const els = main.querySelectorAll('.slide');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const counter = document.getElementById('counter');

function render(){
  els.forEach((el,i)=>el.classList.toggle('active', i===idx));
  counter.textContent = (idx+1) + ' / ' + slides.length;
  prevBtn.disabled = idx===0;
  nextBtn.disabled = idx===slides.length-1;
  els[idx].scrollTop = 0;
}
prevBtn.addEventListener('click', ()=>{ if(idx>0){idx--; render();} });
nextBtn.addEventListener('click', ()=>{ if(idx<slides.length-1){idx++; render();} });
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight'){ if(idx<slides.length-1){idx++; render();} }
  if(e.key==='ArrowLeft'){ if(idx>0){idx--; render();} }
});
render();
</script>
</body>
</html>
